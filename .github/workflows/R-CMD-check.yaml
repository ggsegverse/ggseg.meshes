on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "14 3 * * 0"

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    uses: ggsegverse/.github/.github/workflows/R-CMD-check.yaml@main
    with:
      # ggseg.formats is in Suggests from 0.0.1.9002 (the meshes carry a
      # mesh_space() of its class), and it is not on CRAN, so resolution
      # fails against CRAN alone.
      extra-repositories: https://ggsegverse.r-universe.dev
      build-args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
