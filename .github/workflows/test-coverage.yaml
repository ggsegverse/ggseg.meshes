on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions:
  contents: write

jobs:
  test-coverage:
    uses: ggsegverse/.github/.github/workflows/test-coverage.yaml@main
    with:
      # ggseg.formats is in Suggests from 0.0.1.9002 (the meshes carry a
      # mesh_space() of its class), and it is not on CRAN, so resolution
      # fails against CRAN alone.
      extra-repositories: https://ggsegverse.r-universe.dev
    secrets: inherit
